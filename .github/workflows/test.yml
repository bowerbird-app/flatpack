name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Rails Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flatpack_dummy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 3

      - name: Rebuild native extensions
        run: bundle pristine

      - name: Prepare dummy database
        working-directory: test/dummy
        env:
          RAILS_ENV: test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_NAME: flatpack_dummy_test
        run: |
          # A local clone of the Bundler git cache hardlinks commit-graph
          # files. A graph still being written fails the clone with
          # "hardlink different from source" before db:prepare runs.
          git config --global core.commitGraph false
          git config --global fetch.writeCommitGraph false
          git config --global gc.writeCommitGraph false
          find /opt/hostedtoolcache/Ruby -type d -name commit-graphs -print0 2>/dev/null | xargs -0 -r rm -rf
          installed=0
          for attempt in 1 2 3; do
            if bundle install; then
              installed=1
              break
            fi
            echo "bundle install failed (attempt ${attempt}); retrying"
            sleep $((attempt * 2))
          done
          if [ "$installed" -ne 1 ]; then
            exit 1
          fi
          bundle exec rails db:prepare

      - name: Run tests
        env:
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_NAME: flatpack_dummy_test
        run: bundle exec rails test

      - name: Install Chrome
        # browser-actions/setup-chrome v1.7.3
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce
        with:
          chrome-version: stable

      - name: Run system tests
        env:
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_NAME: flatpack_dummy_test
        run: bundle exec rails test:system

  dummy-app:
    name: Dummy App Tests (Rails 8)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 3

      - name: Rebuild native extensions
        run: bundle pristine

      - name: Refresh vendored FlatPack snapshot
        working-directory: test/dummy
        run: |
          bin/refresh_flat_pack_vendor
          status="$(git status --porcelain -- vendor/flat_pack)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi

      - name: Install dummy app dependencies
        working-directory: test/dummy
        run: |
          # Same commit-graph hardlink race as the Rails Tests dummy install.
          git config --global core.commitGraph false
          git config --global fetch.writeCommitGraph false
          git config --global gc.writeCommitGraph false
          find /opt/hostedtoolcache/Ruby -type d -name commit-graphs -print0 2>/dev/null | xargs -0 -r rm -rf
          installed=0
          for attempt in 1 2 3; do
            if bundle install; then
              installed=1
              break
            fi
            echo "bundle install failed (attempt ${attempt}); retrying"
            sleep $((attempt * 2))
          done
          if [ "$installed" -ne 1 ]; then
            exit 1
          fi

      - name: Prepare databases
        working-directory: test/dummy
        env:
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
        run: |
          bundle exec rails db:prepare
          RAILS_ENV=test bundle exec rails db:prepare

      - name: Build Tailwind CSS
        working-directory: test/dummy
        run: |
          bundle exec tailwindcss -c config/tailwind.config.js -i app/assets/stylesheets/application.css -o app/assets/builds/application.css
          ln -sfn application.css app/assets/builds/tailwind.css

      - name: Verify dummy app can boot
        working-directory: test/dummy
        env:
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
        run: |
          bundle exec rails runner "puts RecordingStudio.name"
          bundle exec rails runner "puts 'Rails app loaded successfully'"
          echo "Dummy app verified successfully"

      - name: Run dummy app tests
        working-directory: test/dummy
        env:
          RAILS_ENV: test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_NAME: flatpack_dummy_test
        run: bundle exec rails test test/requests/recording_studio_host_wiring_test.rb test/requests/public_catalog_without_db_test.rb test/requests/demo_database_pages_test.rb test/requests/unsupported_browser_test.rb test/requests/pages_tables_reorder_test.rb test/requests/demo_comments_test.rb test/requests/collection_editors_test.rb test/requests/locale_switching_test.rb test/controllers/pages_controller_private_test.rb test/requests/pages_gallery_editor_demo_test.rb test/requests/pages_page_layout_demo_test.rb

  dummy-app-rails-7:
    name: Dummy App Tests (Rails 7)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: test/dummy-rails-7
          cache-version: 2

      - name: Set up database
        working-directory: test/dummy-rails-7
        run: bundle exec rails db:create db:schema:load

      - name: Verify Rails 7 dummy app can boot
        working-directory: test/dummy-rails-7
        run: |
          bundle exec rails runner "puts 'Rails ' + Rails::VERSION::STRING + ' loaded. FlatPack: ' + FlatPack::VERSION"
          echo "Rails 7 dummy app verified successfully"

      - name: Run Rails 7 dummy app tests
        working-directory: test/dummy-rails-7
        run: bundle exec rails test

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 3

      - name: Rebuild native extensions
        run: bundle pristine

      - name: Run RuboCop
        run: bundle exec rubocop
